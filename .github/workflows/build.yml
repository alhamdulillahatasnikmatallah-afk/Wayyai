name: Build WayyAi APK (32 & 64 bit)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract WayyAi.zip
        run: |
          echo "=== Listing files ==="
          ls -la
          if [ -f "WayyAi.zip" ]; then
            echo "Found WayyAi.zip, extracting..."
            unzip -o WayyAi.zip
            echo "Extracted successfully"
            ls -la
          else
            echo "WayyAi.zip not found, assuming project is already extracted"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        working-directory: WayyAi
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          flutter pub get

      - name: Analyze
        working-directory: WayyAi
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (split per ABI - 32bit + 64bit)
        working-directory: WayyAi
        run: |
          flutter build apk --release --split-per-abi

      - name: Build universal APK (all ABIs)
        working-directory: WayyAi
        run: flutter build apk --release

      - name: List artifacts
        working-directory: WayyAi
        run: |
          ls -lah build/app/outputs/flutter-apk/
          echo "=== APK sizes ==="
          du -h build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wayyai-apks
          path: |
            WayyAi/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            WayyAi/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            WayyAi/build/app/outputs/flutter-apk/app-x86_64-release.apk
            WayyAi/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
